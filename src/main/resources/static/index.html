<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <style>
        /* Basic page layout */
        body {
            margin: 0;
            padding: 32px 20px;
            background-color: #f3f5f9;
            color: #263248;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 1150px;
            margin: 0 auto;
        }

        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 24px;
        }

        .page-header h1 {
            margin: 0;
            color: #1d2b45;
            font-size: 28px;
        }

        .page-header p {
            margin: 7px 0 0;
            color: #69758b;
            font-size: 14px;
        }

        /* Put the form and student list next to each other */
        .content-layout {
            display: grid;
            grid-template-columns: minmax(270px, 0.8fr) minmax(0, 1.7fr);
            align-items: start;
            gap: 22px;
        }

        .card {
            min-width: 0;
            padding: 24px;
            border: 1px solid #e2e7ef;
            border-radius: 12px;
            background-color: #ffffff;
            box-shadow: 0 5px 18px rgba(31, 48, 77, 0.06);
        }

        .card h2 {
            margin: 0;
            color: #263248;
            font-size: 19px;
        }

        .card-description {
            margin: 7px 0 22px;
            color: #778297;
            font-size: 13px;
            line-height: 1.5;
        }

        /* Form fields and validation messages */
        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #39465d;
            font-size: 13px;
            font-weight: bold;
        }

        input[type="text"],
        input[type="email"] {
            width: 100%;
            height: 42px;
            padding: 0 11px;
            box-sizing: border-box;
            border: 1px solid #d5dce7;
            border-radius: 7px;
            background-color: #ffffff;
            color: #263248;
            font: inherit;
            font-size: 13px;
        }

        input[type="text"]:focus,
        input[type="email"]:focus {
            border-color: #5275d8;
            outline: 3px solid rgba(82, 117, 216, 0.15);
        }

        input.invalid {
            border-color: #d64545;
        }

        .error-message {
            display: block;
            margin-top: 5px;
            color: #c43d48;
            font-size: 12px;
        }

        button {
            padding: 10px 14px;
            border: 0;
            border-radius: 7px;
            cursor: pointer;
            font: inherit;
            font-size: 13px;
            font-weight: bold;
        }

        .btn-submit {
            width: 100%;
            margin-top: 2px;
            background-color: #4169d8;
            color: #ffffff;
        }

        .btn-submit:hover {
            background-color: #3459c3;
        }

        .btn-logout {
            border: 1px solid #d9e0eb;
            background-color: #ffffff;
            color: #39465d;
        }

        .btn-logout:hover {
            background-color: #f8faff;
        }

        /* Student table */
        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            min-width: 580px;
            border-collapse: collapse;
            text-align: left;
        }

        th,
        td {
            padding: 12px 10px;
            border-bottom: 1px solid #e8ecf2;
        }

        th {
            background-color: #f6f8fc;
            color: #657187;
            font-size: 11px;
            text-transform: uppercase;
        }

        td {
            color: #39465d;
            font-size: 13px;
        }

        td:last-child {
            white-space: nowrap;
        }

        .btn-edit {
            margin-right: 4px;
            background-color: #eaf0ff;
            color: #3158b8;
        }

        .btn-edit:hover {
            background-color: #dce6ff;
        }

        .btn-delete {
            background-color: #fff0f0;
            color: #b93838;
        }

        .btn-delete:hover {
            background-color: #ffe1e1;
        }

        /* Stack the panels on smaller screens */
        @media (max-width: 800px) {
            body {
                padding: 22px 16px;
            }

            .content-layout {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 500px) {
            .page-header {
                align-items: flex-start;
                flex-direction: column;
            }

            .page-header h1 {
                font-size: 24px;
            }

            .card {
                padding: 19px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <header class="page-header">
        <div>
            <h1>Student Management</h1>
            <p>Keep student details organized in one place.</p>
        </div>
        <button type="button" class="btn-logout" id="logoutBtn" onclick="logoutUser()">Log out</button>
    </header>

    <main class="content-layout">
        <section class="card" aria-labelledby="form-title">
            <h2 id="form-title">Add a student</h2>
            <p class="card-description">Enter the student's details below.</p>

            <form id="studentForm" novalidate>
                <input type="hidden" id="studentId">

                <div class="form-group">
                    <label for="firstName">First name</label>
                    <input type="text" id="firstName" required minlength="2" maxlength="50">
                    <span id="firstNameError" class="error-message"></span>
                </div>

                <div class="form-group">
                    <label for="lastName">Last name</label>
                    <input type="text" id="lastName" required minlength="2" maxlength="50">
                    <span id="lastNameError" class="error-message"></span>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required
                           pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$">
                    <span id="emailError" class="error-message"></span>
                </div>

                <button type="submit" class="btn-submit" id="submitBtn">Add Student</button>
            </form>
        </section>

        <section class="card" aria-labelledby="list-title">
            <h2 id="list-title">Student list</h2>
            <p class="card-description">View, edit, or remove student records.</p>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th scope="col">ID</th>
                            <th scope="col">First name</th>
                            <th scope="col">Last name</th>
                            <th scope="col">Email</th>
                            <th scope="col">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="studentTableBody"></tbody>
                </table>
            </div>
        </section>
    </main>
</div>
<script src="validation.js"></script>
<script src="app.js"></script>
</body>
</html>
